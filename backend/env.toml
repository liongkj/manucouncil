[server]
title = "Research Writing Council"
version = "0.1.0"
host = "127.0.0.1"
port = 8080

[cors]
allow_origins = ["*"]
allow_credentials = true
allow_methods = ["*"]
allow_headers = ["*"]

[opencode]
port = 4096
launch_timeout = 30
health_timeout = 30
shutdown_wait = 10
models_timeout = 15
models_cache_ttl = 60
auth_username = "opencode"

[bridge.http_client]
timeout_total = 600.0
timeout_read = 600.0
timeout_connect = 30.0
retries = 1
retry_backoff_factor = 2.0

[pipeline]
chain_of_thought_kicker = "\n\nFirst, re-read the user's text carefully. Then work through your analysis step by step before writing your final response."
default_confidence = 0.5
quorum_min_members = 2
critique_retry = 1
stream_delay_seconds = 0.05

[pipeline.prompts]
critique_system = "You are a peer reviewer evaluating other reviewers. Be critical and specific. Output ONLY valid JSON."
critique_retry_system = "You are a peer reviewer. Output ONLY valid JSON. No markdown, no code fences."
chair_system = "You are the Chair of a scientific writing council. Synthesize, do not average."
revision_system_suffix = "You are participating in a multi-round debate. Revise your analysis based on peer feedback."

[storage]
# Relative to project root (directory containing backend/)
session_dir = "data/sessions"

[debug]
# Relative to project root (directory containing backend/)
debug_dir = "data/debug"
